services:

  nginx:
    image: nginx:1.27-alpine
    container_name: helpdesk-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - helpdesk-net

  php-fpm:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: helpdesk-php
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-helpdesk}
      - DB_USERNAME=${DB_USERNAME:-helpdesk_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - helpdesk-net

  mysql:
    image: mysql:8.4
    container_name: helpdesk-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-helpdesk}
      MYSQL_USER: ${DB_USERNAME:-helpdesk_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - helpdesk-net

networks:
  helpdesk-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
